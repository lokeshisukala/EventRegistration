
<!DOCTYPE html>
<html>
<head>
    <title>Event Registration</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
        }
        form {
            background: white;
            width: 350px;
            margin: 30px auto;
            padding: 20px;
            border-radius: 10px;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            box-sizing: border-box;
        }
        button {
            background: green;
            color: white;
            padding: 10px;
            border: none;
            width: 100%;
        }
    </style>
</head>
<body>

<form>
    <h2>Event Registration</h2>

    <label>Name:</label>
    <input type="text" required>

    <label>Email:</label>
    <input type="email" required>

    <label>Phone:</label>
    <input type="tel" required>

    <label>College:</label>
    <input type="text">

    <label>Department:</label>
    <select>
        <option>CSE</option>
        <option>ECE</option>
        <option>EEE</option>
        <option>IT</option>
    </select>

    <label>Gender:</label>
    <input type="radio" name="gender"> Male
    <input type="radio" name="gender"> Female

    <label>Additional Information:</label>
    <textarea></textarea>

    <button type="submit">Register</button>
</form>

</body>
</html>
